name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # Installs the R8-minified release build on an emulator and checks it launches without crashing.
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble minified release
        run: ./gradlew :app:assembleRelease -PdebugSignRelease --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-x86_64-release.apk
            adb logcat -c
            adb shell am start -W -n app.kotoba/.MainActivity
            sleep 20
            adb shell monkey -p app.kotoba --pct-syskeys 0 --throttle 300 -s 42 150 || true
            sleep 5
            adb logcat -d > logcat.txt
            if grep -q "Process: app.kotoba" logcat.txt; then grep -B2 -A40 "FATAL EXCEPTION" logcat.txt; exit 1; fi
            adb shell pidof app.kotoba || echo "app not running after monkey (no crash logged)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: logcat.txt
